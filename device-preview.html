r;list-style:none;font-size:14px;color:var(--ink)}\n.history-archive>summary::-webkit-details-marker{display:none}\n.history-archive summary small{font-size:13px;color:var(--muted);margin-left:7px}\n.archive-expand,.archive-collapse{color:var(--gold);font-size:13px}\n.archive-collapse{display:none}.history-archive[open] .archive-expand{display:none}.history-archive[open] .archive-collapse{display:inline}\n.archive-content{padding-top:12px}\n.archive-pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}\n.archive-pagination .button{font-size:14px;padding:9px 12px}\n.archive-pagination button:disabled{cursor:default;opacity:.35}\n@media(max-width:600px){\n  .page-heading{margin-bottom:18px;gap:5px 12px}\n  .page-heading h1{font-size:26px}\n  .card,.hero,.strategy-card{padding:22px}\n  .disclosure{padding:0}\n  .holdings-actions{margin-bottom:18px;gap:10px}\n  .card-action{font-size:14px;padding:10px 12px;white-space:nowrap}\n  .card-actions{gap:7px}\n  .hero-top{align-items:center}\n  .history-table{min-width:0}\n  .history-table th:nth-child(1){width:31%}.history-table th:nth-child(2){width:40%}.history-table th:nth-child(3){width:29%}\n}\n@media(max-width:370px){.holdings-actions h2,.record-actions h2{font-size:16px}.card-action{padding:10px;font-size:13px}.card-actions{gap:6px}.card,.hero,.strategy-card{padding:19px}.disclosure{padding:0}}\n\n/* Keep the overview's primary amount distinct from supporting information. */\n.wealth-summary{display:flex;flex-direction:column;padding:28px;overflow:hidden}\n.summary-heading{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500}\n.summary-currency{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap}\n.summary-amount{text-align:center;font-size:clamp(38px,3.8vw,52px);font-weight:650;letter-spacing:-1.3px;line-height:1.15;margin-top:22px;overflow-wrap:anywhere}\n.summary-amount.long-amount{font-size:clamp(28px,2.7vw,38px);letter-spacing:-.6px}\n.summary-holdings{text-align:center;font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}\n.summary-return{margin:20px 0;padding:0;border:0;border-radius:0;background:none;text-align:center}\n.summary-return-label{font-size:13px;color:var(--muted);margin-bottom:7px}\n.summary-pnl{font-size:25px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}\n.summary-pnl>span{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:7px 10px;min-width:0}\n.summary-pnl small{display:inline-block;font-size:13px;font-weight:400;padding:0;border:0;border-radius:0;background:none;line-height:1.3;white-space:nowrap}\n.summary-pnl>.muted{font-size:16px;line-height:1.6}\n.summary-method{margin-top:9px;font-size:12px;color:var(--muted)}\n.summary-method>summary{display:flex;align-items:center;gap:5px;min-height:32px;cursor:pointer;list-style:none;width:fit-content;margin-inline:auto}\n.summary-method>summary::-webkit-details-marker{display:none}\n.summary-method svg{width:12px;height:12px;transform:rotate(90deg)}\n.summary-method[open] svg{transform:rotate(270deg)}\n.summary-method p{padding-top:4px;line-height:1.8;overflow-wrap:anywhere}\n.summary-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:auto}\n.summary-updated{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:12px;min-width:0;line-height:1.6}\n.summary-updated>.mono{color:var(--ink);font-size:13px}\n.summary-refresh{font-size:13px;font-weight:500;color:var(--gold);padding:9px 12px;flex-shrink:0}\n@media(max-width:900px){\n  .wealth-summary{padding:24px}\n  .summary-amount{text-align:center;font-size:clamp(34px,10.5vw,44px);letter-spacing:-1px;margin-top:20px}\n  .summary-amount.long-amount{font-size:clamp(24px,7vw,32px)}\n  .summary-return{margin-top:18px;padding:0}\n  .summary-pnl{font-size:23px}\n}\n@media(max-width:370px){\n  .wealth-summary{padding:20px}\n  .summary-heading{gap:8px}\n  .summary-currency{font-size:11px}\n  .summary-return{padding:0}\n  .summary-pnl{font-size:21px}\n  .summary-refresh{padding:9px 10px}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003csection id=\"loginView\" class=\"login-view\">\n    \u003cdiv class=\"login-art\" aria-hidden=\"true\">\u003cdiv class=\"orb orb-one\">\u003c/div>\u003cdiv class=\"orb orb-two\">\u003c/div>\u003cdiv class=\"art-grid\">\u003c/div>\u003csvg viewBox=\"0 0 600 400\">\u003cpath d=\"M0 340 C50 330 65 350 105 300 S160 330 210 250 S270 280 325 210 S390 230 435 150 S520 175 600 50\" fill=\"none\" stroke=\"#dbb76b\" stroke-width=\"2\"/>\u003cpath d=\"M0 340 C50 330 65 350 105 300 S160 330 210 250 S270 280 325 210 S390 230 435 150 S520 175 600 50 L600 400 L0 400Z\" fill=\"url(#fill)\"/>\u003cdefs>\u003clinearGradient id=\"fill\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\u003cstop stop-color=\"#dbb76b\" stop-opacity=\".15\"/>\u003cstop offset=\"1\" stop-color=\"#dbb76b\" stop-opacity=\"0\"/>\u003c/linearGradient>\u003c/defs>\u003c/svg>\u003c/div>\n    \u003cdiv class=\"login-card\">\n      \u003cdiv class=\"brand\">\u003cspan class=\"brand-mark\">W\u003c/span>\u003cspan>Wealth\u003cspan class=\"brand-light\"> Tracker\u003c/span>\u003csmall>資產管理\u003c/small>\u003c/span>\u003c/div>\n      \u003cdiv class=\"eyebrow login-kicker\">YOUR WEALTH, IN FOCUS\u003c/div>\n      \u003ch1>你的資產，\u003cbr>清楚掌握。\u003c/h1>\n      \u003cp class=\"login-description\">整理持倉、追蹤目標，與信任的人\u003cbr class=\"desktop-only\">分享部位和交易想法。\u003c/p>\n      \u003cbutton id=\"loginButton\" class=\"button primary\" disabled>正在連線…\u003c/button>\n      \u003cbutton id=\"demoButton\" class=\"button secondary\">先看看新版介面 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\n      \u003cp class=\"login-footnote\">Google 帳號登入 · 支援加入手機主畫面\u003c/p>\n      \u003cp id=\"loginError\" class=\"form-error\" role=\"alert\">\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"login-bottom\">WEALTH TRACKER \u003cspan>用清楚的紀錄，累積長期的進步。\u003c/span>\u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"pendingView\" class=\"login-view hidden\">\u003cdiv class=\"login-card\">\u003cspan class=\"brand-mark\">W\u003c/span>\u003ch1 class=\"pending-title\">等待使用授權\u003c/h1>\u003cp id=\"pendingMessage\" class=\"login-description\">\u003c/p>\u003cbutton class=\"button primary\" data-action=\"recheck\">重新檢查\u003c/button>\u003cbutton class=\"button secondary\" data-action=\"logout\">登出\u003c/button>\u003c/div>\u003c/section>\n\n  \u003cdiv id=\"appView\" class=\"app-shell hidden\">\n    \u003caside class=\"sidebar\">\u003ca class=\"brand\" href=\"#home\">\u003cspan class=\"brand-mark\">W\u003c/span>\u003cspan>Wealth\u003cspan class=\"brand-light\"> Tracker\u003c/span>\u003csmall>資產管理\u003c/small>\u003c/span>\u003c/a>\u003cdiv class=\"sidebar-caption\">把今天的紀錄，\u003cbr>變成明天的方向。\u003c/div>\u003cnav id=\"navigation\" aria-label=\"主要導覽\">\u003c/nav>\u003cdiv class=\"sidebar-foot\">\u003cspan class=\"status-dot\">\u003c/span>\u003cspan id=\"sidebarStatus\">雲端同步\u003c/span>\u003csmall>VERSION 2.4.8\u003c/small>\u003c/div>\u003c/aside>\n    \u003cdiv class=\"workspace\">\n      \u003cheader class=\"topbar\">\u003cdiv class=\"mobile-brand\">\u003cspan class=\"brand-mark\">W\u003c/span>\u003cspan>Wealth Tracker\u003c/span>\u003c/div>\u003cdiv class=\"breadcrumb\" id=\"breadcrumb\">我的資產 / 總覽\u003c/div>\u003cdiv class=\"topbar-right\">\u003cspan class=\"local-date\" id=\"localDate\">\u003c/span>\u003cbutton class=\"avatar\" id=\"userAvatar\" data-action=\"account\" aria-label=\"帳號與設定\">\u003c/button>\u003c/div>\u003c/header>\n      \u003cdiv id=\"demoBanner\" class=\"demo-banner hidden\">\u003cspan>示範資料，未連接你的帳號\u003c/span>\u003cbutton data-action=\"exit-demo\">返回登入 ↗\u003c/button>\u003c/div>\n      \u003cmain id=\"content\" tabindex=\"-1\">\u003c/main>\n      \u003cfooter class=\"page-footer\">\u003cspan>WEALTH TRACKER\u003c/span>\u003cspan>持倉有紀錄，決策有依據。\u003c/span>\u003c/footer>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdialog id=\"assetDialog\" class=\"modal\">\u003cform id=\"assetForm\" novalidate>\n    \u003cdiv class=\"modal-heading\">\u003cdiv>\u003cdiv class=\"eyebrow\">MY PORTFOLIO\u003c/div>\u003ch2 id=\"assetDialogTitle\">新增持倉\u003c/h2>\u003c/div>\u003cbutton type=\"button\" class=\"icon-button\" data-close=\"assetDialog\" aria-label=\"關閉\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M6 6l12 12M18 6L6 18\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003clabel>更新方式\u003cselect name=\"mode\">\u003coption value=\"stock\">美股個股\u003c/option>\u003coption value=\"crypto\">加密貨幣\u003c/option>\u003coption value=\"tw\">台股／ETF\u003c/option>\u003coption value=\"usd\">美元現金／帳戶\u003c/option>\u003coption value=\"manual\">手動資產\u003c/option>\u003c/select>\u003c/label>\n    \u003cdiv class=\"form-grid\">\u003clabel>名稱\u003cinput name=\"name\" maxlength=\"80\" placeholder=\"留空使用代號\">\u003c/label>\u003clabel id=\"symbolField\">代號\u003cinput name=\"symbol\" placeholder=\"例如 AAPL\" maxlength=\"80\" autocapitalize=\"characters\" autocomplete=\"off\">\u003c/label>\u003c/div>\n    \u003cdiv class=\"form-grid values-grid\">\u003clabel id=\"quantityField\">\u003cspan id=\"quantityLabel\">持有股數\u003c/span>\u003cinput name=\"qty\" type=\"number\" min=\"0\" step=\"any\" inputmode=\"decimal\" placeholder=\"例如 28\">\u003c/label>\u003clabel id=\"valueField\" class=\"hidden\">目前價值（台幣）\u003cinput name=\"value\" type=\"number\" min=\"0\" step=\"any\" inputmode=\"decimal\">\u003c/label>\u003clabel id=\"nativeCostField\">\u003cspan id=\"nativeCostLabel\">平均買入價（USD／股）\u003c/span>\u003cinput name=\"costPer\" type=\"number\" min=\"0\" step=\"any\" inputmode=\"decimal\" placeholder=\"選填\">\u003c/label>\u003clabel id=\"manualCostField\" class=\"hidden\">本金（台幣）\u003cinput name=\"cost\" type=\"number\" min=\"0\" step=\"any\" inputmode=\"decimal\" placeholder=\"選填\">\u003c/label>\u003c/div>\n    \u003clabel id=\"costFxField\">買入時匯率（USD／TWD）\u003cinput name=\"costFx\" type=\"number\" min=\"0\" step=\"any\" inputmode=\"decimal\" placeholder=\"例如 32.5；留空顯示價差損益\">\u003c/label>\n    \u003clabel id=\"typeField\" class=\"hidden\">類別\u003cselect name=\"type\">\u003coption>現金\u003c/option>\u003coption>其他\u003c/option>\u003coption>加密貨幣\u003c/option>\u003coption>台股\u003c/option>\u003coption>美股\u003c/option>\u003c/select>\u003c/label>\n    \u003clabel id=\"summaryField\" class=\"hidden\">美元資產性質\u003cselect name=\"summary\">\u003coption value=\"no\">美元現金（計入總資產）\u003c/option>\u003coption value=\"yes\">帳戶總值（參考，不重複加總）\u003c/option>\u003c/select>\u003c/label>\n    \u003cp class=\"callout\" id=\"assetModeHint\">\u003c/p>\u003cp class=\"form-error\" id=\"assetError\" role=\"alert\">\u003c/p>\n    \u003cdiv class=\"modal-actions\">\u003cbutton type=\"button\" class=\"button secondary\" data-close=\"assetDialog\">取消\u003c/button>\u003cbutton type=\"submit\" class=\"button primary\">儲存持倉\u003c/button>\u003c/div>\n  \u003c/form>\u003c/dialog>\n\n  \u003cdialog id=\"strategyDialog\" class=\"modal\">\u003cform id=\"strategyForm\" novalidate>\n    \u003cdiv class=\"modal-heading\">\u003cdiv>\u003cdiv class=\"eyebrow\">TRADE WITH A PLAN\u003c/div>\u003ch2 id=\"strategyDialogTitle\">新增交易策略\u003c/h2>\u003c/div>\u003cbutton type=\"button\" class=\"icon-button\" data-close=\"strategyDialog\" aria-label=\"關閉\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M6 6l12 12M18 6L6 18\"/>\u003c/svg>\u003c/button>\u003c/div>\n    \u003clabel>策略名稱\u003cinput name=\"title\" maxlength=\"100\" placeholder=\"例如：分批布局指數 ETF\" required>\u003c/label>\n    \u003cdiv class=\"form-grid\">\u003clabel>持有週期\u003cselect name=\"term\">\u003coption value=\"long\">長線\u003c/option>\u003coption value=\"short\">短線\u003c/option>\u003c/select>\u003c/label>\u003clabel>標的\u003cinput name=\"symbol\" maxlength=\"80\" placeholder=\"例如 0050 / BTC\" required>\u003c/label>\u003c/div>\n    \u003clabel>交易理由\u003ctextarea name=\"thesis\" rows=\"3\" maxlength=\"4000\" placeholder=\"這筆交易的依據是什麼？\" required>\u003c/textarea>\u003c/label>\n    \u003clabel>進場條件\u003ctextarea name=\"entry\" rows=\"2\" maxlength=\"1500\" placeholder=\"出現什麼條件才執行？\">\u003c/textarea>\u003c/label>\n    \u003clabel>失效／退出條件\u003ctextarea name=\"invalidation\" rows=\"2\" maxlength=\"1500\" placeholder=\"什麼情況代表原判斷失效？\">\u003c/textarea>\u003c/label>\n    \u003cdiv class=\"form-grid\">\u003clabel>目標／預期持有時間\u003cinput name=\"target\" maxlength=\"200\" placeholder=\"選填\">\u003c/label>\u003clabel>執行狀態\u003cselect name=\"status\">\u003coption value=\"watching\">觀察中\u003c/option>\u003coption value=\"active\">執行中\u003c/option>\u003coption value=\"closed\">已結束\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n    \u003clabel class=\"checkbox-row\">\u003cinput name=\"published\" type=\"checkbox\">\u003cspan>分享給「策略」授權名單中的朋友\u003c/span>\u003c/label>\u003cp class=\"muted small\">未勾選即為私人草稿；持倉與策略使用不同的授權名單。\u003c/p>\u003cp class=\"form-error\" id=\"strategyError\" role=\"alert\">\u003c/p>\n    \u003cdiv class=\"modal-actions\">\u003cbutton type=\"button\" class=\"button secondary\" data-close=\"strategyDialog\">取消\u003c/button>\u003cbutton type=\"submit\" class=\"button primary\">儲存策略\u003c/button>\u003c/div>\n  \u003c/form>\u003c/dialog>\n\n  \u003cdialog id=\"confirmDialog\" class=\"modal small-modal\">\u003ch2 id=\"confirmTitle\">確認操作\u003c/h2>\u003cp id=\"confirmText\" class=\"muted\">\u003c/p>\u003cdiv class=\"modal-actions\">\u003cbutton class=\"button secondary\" data-close=\"confirmDialog\">取消\u003c/button>\u003cbutton id=\"confirmAction\" class=\"button danger\">確認\u003c/button>\u003c/div>\u003c/dialog>\n  \u003cdiv id=\"toast\" class=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n  \u003cscript>const FIREBASE_CONFIG = {\n  apiKey: \"AIzaSyBJPiSvGWMsZulBR7iQpN5gzslC8-9d7YA\",\n  authDomain: \"networth-app-c56c7.firebaseapp.com\",\n  projectId: \"networth-app-c56c7\",\n  storageBucket: \"networth-app-c56c7.firebasestorage.app\",\n  messagingSenderId: \"286114990399\",\n  appId: \"1:286114990399:web:d02af67f76a9adfdaf2b8a\"\n};\nconst ADMIN_EMAIL = \"aaz52468599@gmail.com\";\nconst VERSION = \"2.4.8\";\nconst DEFAULT_SETTINGS = { goal: 10000000, targetDate: \"2030-05-17\", monthly: 0, finnhubKey: \"\" };\n\nconst TYPES = { manual: \"手動資產\", crypto: \"加密貨幣\", tw: \"台股\", stock: \"美股\", usd: \"美元資產\" };\nconst finite = value => typeof value === \"number\" && Number.isFinite(value);\nconst positive = value => finite(value) && value > 0;\nconst id = () => crypto.randomUUID();\nconst taipeiDay = (date = new Date()) => new Intl.DateTimeFormat(\"sv-SE\", {timeZone:\"Asia/Taipei\",year:\"numeric\",month:\"2-digit\",day:\"2-digit\"}).format(date);\nconst stamp = value => {\n  const date = new Date(value);\n  return value && finite(date.getTime()) ? new Intl.DateTimeFormat(\"zh-TW\", {timeZone:\"Asia/Taipei\",month:\"2-digit\",day:\"2-digit\",hour:\"2-digit\",minute:\"2-digit\",hour12:false}).format(date) : \"時間未確認\";\n};\nconst num = (value, digits = 2) => finite(value) ? value.toLocaleString(\"zh-TW\", {maximumFractionDigits:digits}) : \"—\";\nconst money = value => finite(value) ? \"NT$ \" + num(value, 0) : \"—\";\nconst compact = value => Math.abs(value) >= 1e8 ? num(value / 1e8, 2) + \" 億\" : num(value / 1e4, 1) + \" 萬\";\nconst signed = value => finite(value) ? (value > 0 ? \"+\" : value \u003c 0 ? \"−\" : \"\") + num(Math.abs(value), 0) : \"—\";\nconst esc = value => String(value ?? \"\").replace(/[&\u003c>\"']/g, c => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\n\nfunction normalizeAsset(old, legacyQuotes = {}) {\n  const a = {...old, mode: old.mode || \"manual\", id: old.id || id(), isSummary: old.isSummary === true};\n  if (a.mode === \"manual\" || a.quote) return a;\n  const qty = +a.qty || 0, fx = +legacyQuotes?.fx || 0;\n  const tw = a.mode === \"tw\";\n  const nativePrice = a.mode === \"usd\" ? 1 : qty > 0 && (tw || fx > 0) && positive(+a.value) ? +a.value / qty / (tw ? 1 : fx) : null;\n  a.legacyValue = finite(+a.value) ? +a.value : 0;\n  a.quote = {nativePrice, fx:tw ? 1 : fx || null, currency:tw ? \"TWD\" : \"USD\", source:\"舊資料快照\", priceAt:null, fetchedAt:null, fxAt:null, error:\"舊報價時間未確認，請更新\"};\n  return a;\n}\n\nfunction valuation(a) {\n  const manual = a.mode === \"manual\", tw = a.mode === \"tw\";\n  const currency = manual || tw ? \"TWD\" : \"USD\";\n  const qty = +a.qty || 0;\n  const price = manual ? null : a.mode === \"usd\" ? 1 : a.quote?.nativePrice;\n  const fx = currency === \"TWD\" ? 1 : a.quote?.fx;\n  const nativeValue = manual ? (+a.value || 0) : positive(price) ? price * qty : null;\n  const calculated = finite(nativeValue) && positive(fx);\n  const value = calculated ? nativeValue * fx : finite(a.legacyValue) ? a.legacyValue : null;\n  const costNative = manual ? (positive(+a.cost) ? +a.cost : null) : positive(+a.costPer) ? +a.costPer * (a.mode === \"usd\" ? 1 : qty) : null;\n  const fixedCost = positive(+a.costFx) && positive(costNative) ? costNative * +a.costFx : null;\n  let cost = currency === \"TWD\" ? costNative : fixedCost ?? (positive(fx) && positive(costNative) ? costNative * fx : null);\n  // Older manual-total cost records are preserved when no native cost exists.\n  if (!positive(costNative) && positive(+a.cost)) cost = +a.cost;\n  const pnl = calculated && finite(value) && positive(cost) ? value - cost : null;\n  const pnlNative = finite(nativeValue) && positive(costNative) ? nativeValue - costNative : null;\n  const kind = currency === \"USD\" && positive(costNative) && !positive(+a.costFx) ? \"價差損益・未計匯差\" : \"浮動損益\";\n  return {value, nativeValue, currency, price, fx, cost, pnl, pnlNative, percent:positive(cost) && finite(pnl) ? pnl / cost * 100 : null, kind, missing:!calculated, stale:!manual && (!!a.quote?.error || !a.quote?.fetchedAt), excluded:a.isSummary === true};\n}\n\nfunction portfolio(assets) {\n  const included = assets.filter(a => !a.isSummary).map(a => ({asset:a,...valuation(a)}));\n  const covered = included.filter(a => finite(a.pnl));\n  const total = included.reduce((sum,a) => sum + (a.value ?? 0), 0);\n  const cost = covered.reduce((sum,a) => sum + a.cost, 0);\n  const pnl = covered.length ? covered.reduce((sum,a) => sum + a.pnl, 0) : null;\n  return {total,cost,pnl,percent:cost > 0 && finite(pnl) ? pnl / cost * 100 : null,count:included.length,covered:covered.length,stale:included.filter(a=>a.stale || a.missing).length};\n}\n\nfunction requiredRates(assets, settings, now = new Date()) {\n  const value = portfolio(assets).total, goal = +settings.goal, monthly = +settings.monthly || 0;\n  const end = new Date(settings.targetDate + \"T23:59:59+08:00\");\n  if (!positive(goal) || !finite(end.getTime()) || monthly \u003c 0) return {state:\"invalid\"};\n  const days = Math.max(0, (end - now) / 86400000), months = days / (365.2425/12);\n  const gap = goal - value;\n  if (gap \u003c= 0) return {state:\"done\",days,months,gap:0};\n  if (months \u003c= 0) return {state:\"expired\",days,months,gap};\n  if (value === 0 && monthly === 0) return {state:\"noCapital\",days,months,gap};\n  const future = r => { const l = Math.log1p(r); return value * Math.exp(months*l) + (r === 0 ? monthly * months : monthly * Math.expm1(months*l)/r); };\n  if (future(0) >= goal) return {state:\"contributions\",days,months,gap,rm:0,ry:0};\n  let lo = 0, hi = 0.01;\n  while (future(hi) \u003c goal && hi \u003c 1024) hi *= 2;\n  if (future(hi) \u003c goal) return {state:\"unsolved\",days,months,gap};\n  for (let i=0;i\u003c90;i++) { const m = (lo+hi)/2; if (future(m) \u003c goal) lo=m; else hi=m; }\n  const rm=(lo+hi)/2, ry=Math.expm1(12*Math.log1p(rm));\n  if (!finite(ry) || Math.abs(future(rm)-goal)/goal > 1e-7) return {state:\"unsolved\",days,months,gap};\n  return {state:\"calculated\",days,months,gap,rm,ry,rd:Math.expm1(Math.log1p(ry)/365.2425),final:future(rm)};\n}\n\n// Explicit allowlist: credentials, settings, history and unselected assets never enter a shared document.\nfunction sharedAsset(a) {\n  const keys=[\"id\",\"name\",\"mode\",\"type\",\"symbol\",\"qty\",\"value\",\"legacyValue\",\"cost\",\"costPer\",\"costFx\",\"isSummary\",\"quote\",\"updatedAt\"];\n  const result=Object.fromEntries(keys.filter(k=>a[k]!==undefined).map(k=>[k,structuredClone(a[k])]));\n  if(result.quote){const allowed=[\"nativePrice\",\"fx\",\"currency\",\"source\",\"priceAt\",\"fetchedAt\",\"fxAt\",\"fxFetchedAt\",\"error\",\"lastAttemptAt\"];result.quote=Object.fromEntries(allowed.filter(k=>result.quote[k]!==undefined).map(k=>[k,result.quote[k]]));}\n  return result;\n}\nfunction makeSharedPortfolio(assets, settings, name, grants, selectedIds) {\n  const selected=new Set(selectedIds);\n  return {ownerName:name,viewerUids:[...new Set(grants)],assets:assets.filter(a=>selected.has(a.id)).map(sharedAsset),updatedAt:new Date().toISOString()};\n}\n\nfunction parseAsset(fields, previous = null) {\n  const mode=fields.mode;\n  if (!(mode in TYPES)) throw new Error(\"請選擇資產類型\");\n  const toNumber = (raw, title, required=false) => {\n    if (raw === \"\" || raw == null) {if(required) throw new Error(\"請填\"+title); return null;}\n    const value=Number(raw); if(!finite(value) || value\u003c0) throw new Error(title+\"需為有效的非負數字\"); return value;\n  };\n  const name=fields.name.trim() || fields.symbol?.trim().toUpperCase() || (mode===\"usd\" ? \"美元資產\" : \"\");\n  if(!name || name.length>80) throw new Error(\"名稱需為 1～80 個字\");\n  const a={id:previous?.id || id(),name,mode,type:mode===\"manual\"?fields.type:TYPES[mode],symbol:null,qty:null,cost:null,costPer:null,costFx:null,isSummary:mode===\"usd\"&&fields.isSummary===true,createdAt:previous?.createdAt || new Date().toISOString(),updatedAt:new Date().toISOString()};\n  if(mode===\"manual\") {a.value=toNumber(fields.value,\"目前價值\",true);a.cost=toNumber(fields.cost,\"台幣本金\");return a;}\n  a.qty=toNumber(fields.qty,mode===\"usd\"?\"美元金額\":\"持有數量\",true);\n  if(!positive(a.qty)) throw new Error(\"數量或金額需大於 0\");\n  if(mode!==\"usd\") {a.symbol=fields.symbol.trim();if(!a.symbol || !/^[A-Za-z0-9.^_-]{1,80}$/.test(a.symbol)) throw new Error(\"請填有效的代號\"); if(mode!==\"tw\") a.symbol=a.symbol.toUpperCase();}\n  a.costPer=toNumber(fields.costPer,\"買入成本\");\n  a.costFx=mode===\"tw\"?null:toNumber(fields.costFx,\"買入匯率\");\n  if(a.costFx===0) throw new Error(\"買入匯率需大於 0，或留空\");\n  if(previous?.mode===mode && previous?.symbol===a.symbol) {a.quote=previous.quote;a.legacyValue=previous.legacyValue;}\n  return a;\n}\n\nconst paths={home:'\u003cpath d=\"m3 11 9-8 9 8M5 10v10h14V10M9 20v-6h6v6\"/>',assets:'\u003crect x=\"3\" y=\"6\" width=\"18\" height=\"15\" rx=\"3\"/>\u003cpath d=\"M8 6V3h8v3M3 12h18M10 12v3h4v-3\"/>',sharing:'\u003ccircle cx=\"6\" cy=\"12\" r=\"3\"/>\u003ccircle cx=\"18\" cy=\"5\" r=\"3\"/>\u003ccircle cx=\"18\" cy=\"19\" r=\"3\"/>\u003cpath d=\"m9 10 6-4M9 14l6 4\"/>',history:'\u003cpath d=\"M4 18V6M4 18h17m-13-4 4-5 4 3 5-7\"/>',settings:'\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003cpath d=\"m9 3-1 3-3 1-2 4 2 3 1 4 4 3 4-1 4-2 3-4-1-4-3-2-3-3z\"/>',arrow:'\u003cpath d=\"m7 17 10-10M7 7h10v10\"/>',plus:'\u003cpath d=\"M12 5v14M5 12h14\"/>',refresh:'\u003cpath d=\"M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-2l2 2M18 17A7 7 0 0 1 6 19l-2-2\"/>',lock:'\u003crect x=\"5\" y=\"10\" width=\"14\" height=\"11\" rx=\"2\"/>\u003cpath d=\"M8 10V6a4 4 0 0 1 8 0v4M12 14v3\"/>',users:'\u003ccircle cx=\"9\" cy=\"7\" r=\"3\"/>\u003cpath d=\"M2 21v-3a7 7 0 0 1 14 0v3M17 4a3 3 0 0 1 0 6M19 14a6 6 0 0 1 3 5\"/>',download:'\u003cpath d=\"M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5\"/>',search:'\u003ccircle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/>\u003cpath d=\"m16 16 5 5\"/>',edit:'\u003cpath d=\"m14 4 6 6M4 20l4-1L21 6l-3-3L5 16l-1 4z\"/>',check:'\u003cpath d=\"m5 12 4 4L20 5\"/>',chevron:'\u003cpath d=\"m9 5 7 7-7 7\"/>',document:'\u003cpath d=\"M14 3H5v18h14V8l-5-5zM14 3v5h5M8 12h8M8 16h6\"/>',logout:'\u003cpath d=\"M9 4H3v16h6M9 12h12m-4-4 4 4-4 4\"/>'};\nconst icon=name=>`\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${paths[name]||paths.document}\u003c/svg>`;\n\n\nconst postKeys=['id','ownerUid','ownerName','title','symbol','term','thesis','entry','invalidation','target','status','published','createdAt','updatedAt'];\nconst dateOK=value=>typeof value==='string'&&/^\\d{4}-\\d{2}-\\d{2}$/.test(value)&&Number.isFinite(new Date(value).getTime())&&new Date(value).toISOString().slice(0,10)===value;\nfunction buildBackup(state){\n  const {goal,targetDate,monthly}=state.settings;\n  return {version:2,exportedAt:new Date().toISOString(),settings:{goal,targetDate,monthly},assets:state.assets.map(sharedAsset),history:state.history.map(({date,total})=>({date,total})),strategies:state.ownPosts.map(p=>Object.fromEntries(postKeys.filter(k=>p[k]!==undefined).map(k=>[k,p[k]])))};\n}\nfunction parseBackup(data){\n  if(!data||!Array.isArray(data.assets)||!Array.isArray(data.history)||data.assets.length>1000||data.history.length>5000||(data.version!=null&&![1,2].includes(data.version)))throw new Error('不是有效或支援的資產備份。');\n  const assets=data.assets.map(raw=>{\n    if(!raw||typeof raw.name!=='string'||!['manual','stock','tw','crypto','usd'].includes(raw.mode))throw new Error('備份中有無效資產，尚未匯入。');\n    const old=normalizeAsset(raw,data.quotes);\n    const asset=parseAsset({...old,name:old.name,symbol:old.symbol||'',type:typeof old.type==='string'?old.type.slice(0,80):'其他'});\n    const sanitized=sharedAsset(old);\n    if(sanitized.quote){\n      for(const field of ['nativePrice','fx'])if(sanitized.quote[field]!=null&&(!finite(sanitized.quote[field])||sanitized.quote[field]\u003c=0))throw new Error('備份中有無效報價。');\n      for(const field of ['priceAt','fetchedAt','fxAt','fxFetchedAt','lastAttemptAt'])if(sanitized.quote[field]!=null&&!finite(new Date(sanitized.quote[field]).getTime()))throw new Error('備份中有無效報價時間。');\n      for(const field of ['currency','source','error'])if(sanitized.quote[field]!=null&&typeof sanitized.quote[field]!=='string')throw new Error('備份中有無效報價說明。');\n      asset.quote=sanitized.quote;\n    }\n    if(sanitized.legacyValue!=null){if(!finite(sanitized.legacyValue)||sanitized.legacyValue\u003c0)throw new Error('備份中有無效舊市值。');asset.legacyValue=sanitized.legacyValue;}\n    return asset;\n  });\n  const history=data.history.map(h=>{if(!h||!dateOK(h.date)||!finite(h.total)||h.total\u003c0)throw new Error('備份中有無效日期或資產紀錄。');return {date:h.date,total:h.total};});\n  if(new Set(history.map(h=>h.date)).size!==history.length)throw new Error('備份中有重複的紀錄日期。');\n  let settings=null;\n  if(data.settings){const {goal,targetDate,monthly=0}=data.settings;if(!finite(goal)||goal\u003c=0||!dateOK(targetDate)||!finite(monthly)||monthly\u003c0)throw new Error('備份中的財務目標無效。');settings={goal,targetDate,monthly};}\n  if(data.strategies!=null&&(!Array.isArray(data.strategies)||data.strategies.length>200))throw new Error('備份中的策略格式或筆數無效。');\n  const strategies=(data.strategies||[]).map(raw=>{\n    const post={id:id(),published:false};\n    for(const [key,max,required] of [['title',100,true],['symbol',80,true],['thesis',4000,true],['entry',4000,false],['invalidation',4000,false],['target',4000,false]]){const value=raw?.[key]??'';if(typeof value!=='string'||value.length>max||(required&&!value.trim()))throw new Error('備份中的策略文字無效。');post[key]=value.trim();}\n    if(!['long','short'].includes(raw.term)||!['watching','active','closed'].includes(raw.status))throw new Error('備份中的策略週期或狀態無效。');\n    post.term=raw.term;post.status=raw.status;post.createdAt=raw.createdAt&&finite(new Date(raw.createdAt).getTime())?raw.createdAt:new Date().toISOString();post.updatedAt=new Date().toISOString();return post;\n  });\n  return {assets,history,settings,strategies};\n}\n\nconst cloud={isAdmin:()=>false,connect:async()=>{throw new Error(\"這是獨立預覽，請使用示範版查看；正式版請依更新說明安裝。\");}};const refreshMarket=async()=>{throw new Error(\"獨立預覽使用示範行情。\");};\n\n\n\n\n\n\nconst $=name=>document.getElementById(name);\ncons c/div>`;}\nfunction filteredAssets(){const q=s.search.toLowerCase();return s.assets.filter(a=>(s.filter===\"all\"||a.mode===s.filter)&&(!q||(a.name+\" \"+a.symbol).toLowerCase().includes(q))).sort((a,b)=>s.sort===\"name\"?a.name.localeCompare(b.name):s.sort===\"pnl\"?(valuation(b).pnl??-Infinity)-(valuation(a).pnl??-Infinity):(valuation(b).value||0)-(valuation(a).value||0));}\nfunction assetsPage(){const p=portfolio(s.assets);return `${heading(`${p.count} 個持倉 · 總資產 ${money(p.total)}`)}\u003csection class=\"card\">\u003cdiv class=\"holdings-actions\">\u003ch2>持倉列表\u003c/h2>\u003cdiv class=\"card-actions\">${refreshButton()}\u003cbutton class=\"button secondary card-action\" data-action=\"add-asset\">${icon(\"plus\")}新增持倉\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"toolbar\">\u003cdiv class=\"search-field\">${icon(\"search\")}\u003cinput id=\"assetSearch\" placeholder=\"搜尋名稱或代號\" value=\"${esc(s.search)}\" aria-label=\"搜尋持倉\">\u003c/div>\u003cselect id=\"assetFilter\" aria-label=\"資產類別\">\u003coption value=\"all\">所有類別\u003c/option>${Object.entries(TYPES).map(([k,v])=>`\u003coption value=\"${k}\" ${s.filter===k?\"selected\":\"\"}>${v}\u003c/option>`).join(\"\")}\u003c/select>\u003cselect id=\"assetSort\" aria-label=\"排序\">\u003coption value=\"value\" ${s.sort===\"value\"?\"selected\":\"\"}>市值高 → 低\u003c/option>\u003coption value=\"pnl\" ${s.sort===\"pnl\"?\"selected\":\"\"}>損益高 → 低\u003c/option>\u003coption value=\"name\" ${s.sort===\"name\"?\"selected\":\"\"}>名稱排序\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"assetRows\">${assetRows(filteredAssets())}\u003c/div>\u003cp class=\"table-note\">美元部位未填買入匯率時，只顯示按目前匯率換算的價差損益；行情與匯率可能有延遲。帳戶總值設為參考值時，不會重複計入總資產。\u003c/p>\u003c/section>`;}\n\nfunction sharing(){const own=s.friend===\"self\",friend=s.friends.find(x=>x.id===s.friend),selected=s.sharingTab;const choices=`\u003cselect id=\"friendSelect\" class=\"friend-select\" aria-label=\"查看對象\">\u003coption value=\"self\">我的分享與草稿\u003c/option>${s.friends.map(f=>`\u0
